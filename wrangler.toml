# Cloudflare Pages + Functions configuration.
# Used by the visitor-analytics Functions in /functions and for local dev.
name = "atillasaadat-me"
compatibility_date = "2024-11-01"
pages_build_output_dir = "dist"

# ----------------------------------------------------------------------------
# Visitor analytics database (D1), read by the Functions as env.DB.
# The binding name must stay "DB" (not the db-named binding that
# `wrangler d1 create` suggests). Remember to apply schema.sql to this database:
#   npx wrangler d1 execute site-analytics --remote --file=./schema.sql
# ----------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "site-analytics"
database_id = "0da187dd-9078-4fe7-a03c-748dd9c75ad2"
