name: CI

# Responsive / cross-device checks. Runs on every push and pull request so a
# change that breaks the mobile, tablet, or desktop layout fails before merge.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  responsive:
    name: Responsive layout tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # playwright.config.ts builds the site and serves the production output,
      # then runs the specs against the mobile/tablet/desktop viewports.
      - name: Run Playwright tests
        run: npm test

      - name: Upload report (screenshots per device + failures)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
